name: build macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the built disk images as a GitHub release"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyflakes numpy
      - run: python -m pyflakes mumbles/ tests/ packaging/
      - run: python -m pytest tests -q

  build:
    needs: test
    # Tests run on every push; building two full app bundles takes minutes, so
    # it happens on a tag, on demand, or when a commit asks for it by name.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build-app]')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. mlx-whisper is the Metal-accelerated backend; the
          # CPU backend rides along so the bundle still works if mlx cannot be
          # packaged, which the selftest below will tell us either way.
          - runner: macos-14
            arch: arm64
            extras: "mlx,cpu,ui"
          # Intel Macs fall back to CTranslate2 on the CPU. macos-13 was
          # retired, so this is the current Intel runner label. Marked
          # non-blocking: an Intel problem must never hold up the Apple
          # Silicon release.
          - runner: macos-15-intel
            arch: x86_64
            extras: "cpu,ui"
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PortAudio
        run: brew install portaudio

      - name: Install mumbles and build tooling
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install ".[${{ matrix.extras }}]"
          # Pin last: torch pulls in a newer setuptools, and py2app cannot
          # build against setuptools 80+ (its spawn() dropped verbose=).
          python -m pip install "setuptools>=77,<80" "py2app>=0.28.7"
          python -c "import setuptools, py2app; print('setuptools', setuptools.__version__)"

      - name: Sanity check the import graph
        run: |
          python -c "import mumbles, mumbles.menubar, mumbles.meter; print(mumbles.__version__)"
          python -c "import rumps, pynput, sounddevice, numpy; print('deps ok')"

      - name: Build the app and disk image
        run: ./packaging/make_dmg.sh

      - name: Verify the bundle
        run: |
          test -d dist/mumbles.app
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" \
            dist/mumbles.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" \
            dist/mumbles.app/Contents/Info.plist
          codesign --verify --verbose dist/mumbles.app
          ls -lh dist/*.dmg

      - name: Prove the bundled interpreter can import everything
        run: |
          # A py2app bundle ships its own `python` alongside the launcher, so
          # picking the first executable found runs the interpreter on empty
          # stdin and exits 0 without testing anything. Ask the Info.plist
          # which one is the app.
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
                 dist/mumbles.app/Contents/Info.plist)"
          BIN="dist/mumbles.app/Contents/MacOS/$EXE"
          if [ ! -x "$BIN" ]; then
            echo "no launcher at $BIN"; ls -la dist/mumbles.app/Contents/MacOS; exit 1
          fi
          echo "bundle launcher: $BIN"
          MUMBLES_SELFTEST=1 "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: mumbles-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show what will be published
        run: ls -lhR artifacts

      # always() lets this job run when the optional Intel leg fails. It must
      # not publish an empty release when the real build failed instead.
      - name: Require at least one disk image
        run: |
          count="$(find artifacts -name '*.dmg' | wc -l | tr -d ' ')"
          echo "found $count disk image(s)"
          test "$count" -gt 0
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: mumbles ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          generate_release_notes: true
          body: |
            Download the disk image for your Mac:

            | Mac | File |
            |---|---|
            | Apple Silicon (M1 and later) | `mumbles-*-macos-arm64.dmg` |
            | Intel | `mumbles-*-macos-x86_64.dmg` |

            Not sure which you have? Apple menu → About This Mac.

            **First launch:** this build is not notarized by Apple (that
            needs a paid Developer account), so macOS blocks it and says it
            "could not verify" the app. Apple never inspected it, rather
            than inspected it and objected. To get past it:

            ```
            xattr -dr com.apple.quarantine /Applications/mumbles.app
            ```

            Or: System Settings → Privacy & Security → Security →
            "Open Anyway". Right-click → Open no longer works; Apple
            removed that bypass in macOS 15. Details are in the
            "READ ME FIRST" file inside the disk image.

            mumbles is a menu bar app — no Dock icon. Hold ⌘⇧Space, talk,
            let go.
